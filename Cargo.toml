[workspace]
resolver = "3"
members = ["crates/event_contract", "crates/openai_adapter", "crates/chat_ui", "crates/telemetry", "apps/chat", "apps/pet", "apps/analytics"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "macros", "migrate"] }
tokio = { version = "1.53", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
