[workspace]
resolver = "3"
members = ["crates/analytics_transport", "crates/shared", "crates/ai_core", "crates/ui", "crates/telemetry", "crates/mcp_bridge", "crates/chat_domain", "crates/chat_application", "crates/persistence", "apps/server", "crates/pet_domain", "crates/pet_runtime", "apps/stats_server"]

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "json", "uuid", "macros", "migrate"] }
tokio = { version = "1.53", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
