name: Verify copilot_use
on:
  push:
    branches: [main, 'teaching/**']
  pull_request:
    branches: [main]
jobs:
  rust-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Release gate rejects incomplete evidence without network access
        run: python3 scripts/tests/release-approval.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run SQLite Chat/Pet and PostgreSQL Analytics integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Verify strict event payload
        run: cargo test -p event-contract

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated CI-only secrets
        run: |
          cat > .env <<'ENV'
          ANALYTICS_BOOTSTRAP_PASSWORD=ci_analytics_bootstrap_only_password
          ANALYTICS_ADMIN_TOKEN=ci_governance_only_token_32_characters
          ANALYTICS_DB_PASSWORD=ci_analytics_only_random_test_password
          CHAT_API_TOKEN=ci_chat_only_token_32_characters
          ANALYTICS_API_TOKEN=ci_analytics_only_token_32_characters
          ANALYTICS_CHAT_TOKEN=ci_chat_ingest_only_token_32_characters
          ANALYTICS_PET_TOKEN=ci_pet_ingest_only_token_32_characters
          ENV
      - name: Build and start isolated app and database containers
        run: COPILOT_BUILD_SHA="$GITHUB_SHA" docker compose --env-file .env up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test durable end-to-end Chat to Analytics ingestion
        run: |
          set -a
          source .env
          set +a
          bash scripts/smoke.sh
          node scripts/realtime-e2e.mjs
      - name: Collect service logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color --tail=150
      - name: Shut down and delete CI databases
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans

  local-fault-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated-test PostgreSQL tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 postgresql-server-dev-16 libpq-dev
      - name: Run HTTP, WebSocket, restart, DB interruption and backup/restore tests
        run: |
          PATH=/usr/lib/postgresql/16/bin:$PATH VERIFY_REPORT=target/local-validation-native.json python3 scripts/local-verify.py --load
          PATH=/usr/lib/postgresql/16/bin:$PATH python3 scripts/local-verify.py --varchar-events
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: local-validation
          path: |
            target/local-validation.json
            target/local-validation-native.json
            target/realtime-load-validation.json

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb,appimage
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        id: build-tools
        with:
          path: |
            ~/.cargo/bin/trunk*
            ~/.cargo/bin/cargo-tauri*
          key: ${{ runner.os }}-trunk-0.21.14-tauri-2.11.5
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Verify Pet persistence and native platform safety
        run: cargo test --locked -p day9-pet --lib
      - name: Install build tooling
        shell: bash
        run: |
          if ! command -v trunk; then cargo install trunk --version 0.21.14 --locked; fi
          if ! command -v cargo-tauri; then cargo install tauri-cli --version 2.11.5 --locked; fi
      - uses: actions/cache/save@v4
        if: steps.build-tools.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/trunk*
            ~/.cargo/bin/cargo-tauri*
          key: ${{ runner.os }}-trunk-0.21.14-tauri-2.11.5
      - name: Compile Chat hydration assets
        shell: bash
        run: bash scripts/build-chat-ui.sh
      - name: Compile Pet hydration assets
        shell: bash
        run: node scripts/build-pet-ui.mjs
      - name: Pet non-square sprite geometry regression
        run: cargo test --locked --manifest-path apps/desktop_pet/frontend/Cargo.toml
      - name: Actual Linux WebKit GUI verification
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/pet-gui-verify.py --updater
      - name: Actual Windows and macOS WebView GUI verification
        if: runner.os != 'Linux'
        shell: bash
        run: python3 scripts/pet-gui-verify.py --updater
      - name: Optimized GLib security backport regression
        if: runner.os == 'Linux'
        run: cargo test --locked --release --manifest-path apps/desktop_pet/Cargo.toml --test glib_variant_safety
      - name: Build native installer
        shell: bash
        run: cd apps/desktop_pet && NO_COLOR=true cargo tauri build --bundles "${{ matrix.bundle }}"
      - name: Execute extracted Linux release package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(find apps/desktop_pet/target/release/bundle/deb -name '*.deb' -print -quit)
          dpkg-deb -x "$package" "$RUNNER_TEMP/pet-package"
          executable=$(find "$RUNNER_TEMP/pet-package" -name copilot-desktop-pet -type f -print -quit)
          xvfb-run -a python3 scripts/pet-gui-verify.py --executable "$executable" --updater
      - name: Install signed AppImage update and cold-start updated executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp 'apps/desktop_pet/target/release/bundle/appimage/Copilot Desktop Pet_0.1.0_amd64.AppImage' "$RUNNER_TEMP/base.AppImage"
          python3 scripts/build-test-update.py
          xvfb-run -a python3 scripts/pet-gui-verify.py --executable "$RUNNER_TEMP/base.AppImage" --updater --update-package 'apps/desktop_pet/target/release/bundle/appimage/Copilot Desktop Pet_0.1.1_amd64.AppImage'
          cp "$RUNNER_TEMP/base.AppImage" 'apps/desktop_pet/target/release/bundle/appimage/Copilot Desktop Pet_0.1.0_amd64.AppImage'
      - name: Execute macOS release app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          executable=$(find apps/desktop_pet/target/release/bundle/macos -path '*/Contents/MacOS/copilot-desktop-pet' -type f -print -quit)
          python3 scripts/pet-gui-verify.py --executable "$executable" --updater
      - name: Install signed macOS bundle update and cold-start updated executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp -R 'apps/desktop_pet/target/release/bundle/macos/Copilot Desktop Pet.app' "$RUNNER_TEMP/base-pet.app"
          python3 scripts/build-test-update.py
          python3 scripts/pet-gui-verify.py --executable "$RUNNER_TEMP/base-pet.app/Contents/MacOS/copilot-desktop-pet" --updater --update-package 'apps/desktop_pet/target/release/bundle/macos/Copilot Desktop Pet.app.tar.gz' --expected-executable 'apps/desktop_pet/target/release/bundle/macos/Copilot Desktop Pet.app/Contents/MacOS/copilot-desktop-pet'
          rm -rf 'apps/desktop_pet/target/release/bundle/macos/Copilot Desktop Pet.app'
          cp -R "$RUNNER_TEMP/base-pet.app" 'apps/desktop_pet/target/release/bundle/macos/Copilot Desktop Pet.app'
      - name: Install and execute Windows release package in disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop_pet/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'pet-package'
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          $executable = Get-ChildItem $destination -Filter copilot-desktop-pet.exe -Recurse | Select-Object -First 1
          if (-not $executable) { throw 'Installed executable missing' }
          python3 scripts/pet-gui-verify.py --executable $executable.FullName --updater
          if ($LASTEXITCODE -ne 0) { throw 'Installed release GUI verification failed' }
      - name: Install signed Windows NSIS update and cold-start updated executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'pet-package') -Filter copilot-desktop-pet.exe -Recurse | Select-Object -First 1
          $baseInstaller = Get-ChildItem apps/desktop_pet/target/release/bundle/nsis -Filter '*_0.1.0_*.exe' | Select-Object -First 1
          if (-not $baseInstaller) { throw 'Base Windows installer missing' }
          $baseName = $baseInstaller.Name
          Copy-Item $baseInstaller.FullName (Join-Path $env:RUNNER_TEMP 'base-installer.exe')
          python3 scripts/build-test-update.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows update fixture build failed' }
          $update = Get-ChildItem apps/desktop_pet/target/release/bundle/nsis -Filter '*_0.1.1_*.exe' | Select-Object -First 1
          if (-not $update) { throw 'Windows update package missing' }
          python3 scripts/pet-gui-verify.py --executable $executable.FullName --updater --update-package $update.FullName --expected-executable apps/desktop_pet/target/test-update/copilot-desktop-pet.exe
          if ($LASTEXITCODE -ne 0) { throw 'Actual signed Windows update failed' }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'base-installer.exe') (Join-Path 'apps/desktop_pet/target/release/bundle/nsis' $baseName) -Force
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop_pet/target/release/bundle/deb/*.deb
            apps/desktop_pet/target/release/bundle/appimage/*_0.1.0_*.AppImage
            apps/desktop_pet/target/release/bundle/macos/*.app/
            apps/desktop_pet/target/release/bundle/nsis/*_0.1.0_*.exe
            target/pet-gui-validation.json

      - name: Preserve isolated Windows updater diagnostics on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: updater-diagnostic-Windows
          path: |
            apps/desktop_pet/target/release/bundle/nsis/*.exe
            apps/desktop_pet/target/release/copilot-desktop-pet.exe
            target/pet-gui-validation.json
