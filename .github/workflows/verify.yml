name: Verify copilot_use
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  rust-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable pgvector for disposable SQLx databases
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d template1 -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace unit and PostgreSQL integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Verify strict event payload
        run: cargo test -p event-contract

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated CI-only secrets
        run: |
          cat > .env <<'ENV'
          CHAT_BOOTSTRAP_PASSWORD=ci_chat_bootstrap_only_password
          ANALYTICS_BOOTSTRAP_PASSWORD=ci_analytics_bootstrap_only_password
          ANALYTICS_ADMIN_TOKEN=ci_governance_only_token_32_characters
          CHAT_DB_PASSWORD=ci_chat_only_random_test_password
          ANALYTICS_DB_PASSWORD=ci_analytics_only_random_test_password
          CHAT_API_TOKEN=ci_chat_only_token_32_characters
          ANALYTICS_API_TOKEN=ci_analytics_only_token_32_characters
          ANALYTICS_CHAT_TOKEN=ci_chat_ingest_only_token_32_characters
          ANALYTICS_PET_TOKEN=ci_pet_ingest_only_token_32_characters
          ENV
      - name: Build and start isolated app and database containers
        run: docker compose --env-file .env up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test durable end-to-end Chat to Analytics ingestion
        run: |
          set -a
          source .env
          set +a
          bash scripts/smoke.sh
          node scripts/realtime-e2e.mjs
      - name: Collect service logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color --tail=150
      - name: Shut down and delete CI databases
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans

  local-fault-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated-test PostgreSQL tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpq-dev postgresql-server-dev-all
          git clone --branch v0.8.7 --depth 1 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector"
          make -C "$RUNNER_TEMP/pgvector"
          sudo make -C "$RUNNER_TEMP/pgvector" install
      - name: Run HTTP, WebSocket, restart, DB interruption and backup/restore tests
        run: python3 scripts/local-verify.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: local-validation
          path: target/local-validation.json

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install build tooling
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.11.5 --locked
      - name: Verify Pet persistence and platform refusal rules
        run: cargo test --locked -p day9-pet --lib
      - name: Compile Chat hydration assets
        shell: bash
        run: bash scripts/build-chat-ui.sh
      - name: Compile Pet hydration assets
        shell: bash
        run: cd apps/pet_ui && NO_COLOR=true trunk build --release=true --no-color
      - name: Actual Linux WebKit GUI verification
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/pet-gui-verify.py
      - name: Build native installer without claiming runtime acceptance
        shell: bash
        run: cd apps/pet_desktop && NO_COLOR=true cargo tauri build --bundles "${{ matrix.bundle }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/pet_desktop/target/release/bundle/
            target/pet-gui-validation.json
