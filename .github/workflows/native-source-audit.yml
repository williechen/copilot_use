name: Audit immutable release Windows provenance
on:
  push:
    branches: [main]
    paths: [.github/workflows/native-source-audit.yml]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22b44f33b9e2c9edb0fb398fb9bff3efd57b00ee
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        id: build-tools
        with:
          path: |
            ~/.cargo/bin/trunk*
            ~/.cargo/bin/cargo-tauri*
          key: ${{ runner.os }}-trunk-0.21.14-tauri-2.11.5
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Verify Pet persistence and native platform safety
        run: cargo test --locked -p day9-pet --lib
      - name: Install build tooling
        shell: bash
        run: |
          if ! command -v trunk; then cargo install trunk --version 0.21.14 --locked; fi
          if ! command -v cargo-tauri; then cargo install tauri-cli --version 2.11.5 --locked; fi
      - uses: actions/cache/save@v4
        if: steps.build-tools.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/trunk*
            ~/.cargo/bin/cargo-tauri*
          key: ${{ runner.os }}-trunk-0.21.14-tauri-2.11.5
      - name: Compile Chat hydration assets
        shell: bash
        run: bash scripts/build-chat-ui.sh
      - name: Compile Pet hydration assets
        shell: bash
        run: node scripts/build-pet-ui.mjs
      - name: Pet non-square sprite geometry regression
        run: cargo test --locked --manifest-path apps/pet_ui/Cargo.toml
      - name: Actual Linux WebKit GUI verification
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/pet-gui-verify.py --updater
      - name: Actual Windows and macOS WebView GUI verification
        if: runner.os != 'Linux'
        shell: bash
        run: python3 scripts/pet-gui-verify.py --updater
      - name: Optimized GLib security backport regression
        if: runner.os == 'Linux'
        run: cargo test --locked --release --manifest-path apps/pet_desktop/Cargo.toml --test glib_variant_safety
      - name: Trace exact immutable source throughout native build
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'source-probe.py'
          @'
          import pathlib,subprocess,json,time,os
          root=pathlib.Path.cwd()
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha=='22b44f33b9e2c9edb0fb398fb9bff3efd57b00ee'
          states=[];seen=set()
          def observe(stage):
              status=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],cwd=root,text=True).strip()
              diff=subprocess.check_output(['git','diff','--no-ext-diff'],cwd=root,text=True)
              identity=(status,diff)
              if identity not in seen:
                  seen.add(identity);states.append({'stage':stage,'status':status,'tracked_diff':diff})
                  print('SOURCE PROVENANCE: '+json.dumps(states[-1]),flush=True)
          observe('before_build')
          process=subprocess.Popen(['cargo','tauri','build','--bundles','nsis'],cwd=root/'apps/pet_desktop',env=os.environ|{'NO_COLOR':'true'})
          while process.poll() is None:
              observe('during_build');time.sleep(.2)
          observe('after_build')
          report=pathlib.Path(os.environ['RUNNER_TEMP'])/'immutable-source-provenance.json'
          report.write_text(json.dumps({'source_sha':sha,'states':states,'build_exit_code':process.returncode},indent=2)+'\n',encoding='utf-8')
          raise SystemExit(process.returncode)
          '@ | Set-Content -LiteralPath $probe -Encoding utf8
          python3 $probe
      - name: Preserve immutable source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-release-windows-source
          path: ${{ runner.temp }}/immutable-source-provenance.json
      - name: Execute extracted Linux release package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(find apps/pet_desktop/target/release/bundle/deb -name '*.deb' -print -quit)
          dpkg-deb -x "$package" "$RUNNER_TEMP/pet-package"
          executable=$(find "$RUNNER_TEMP/pet-package" -name copilot-desktop-pet -type f -print -quit)
          xvfb-run -a python3 scripts/pet-gui-verify.py --executable "$executable" --updater
      - name: Install signed AppImage update and cold-start updated executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp 'apps/pet_desktop/target/release/bundle/appimage/Copilot Desktop Pet_0.1.0_amd64.AppImage' "$RUNNER_TEMP/base.AppImage"
          python3 scripts/build-test-update.py
          xvfb-run -a python3 scripts/pet-gui-verify.py --executable "$RUNNER_TEMP/base.AppImage" --updater --update-package 'apps/pet_desktop/target/release/bundle/appimage/Copilot Desktop Pet_0.1.1_amd64.AppImage'
          cp "$RUNNER_TEMP/base.AppImage" 'apps/pet_desktop/target/release/bundle/appimage/Copilot Desktop Pet_0.1.0_amd64.AppImage'
      - name: Execute macOS release app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          executable=$(find apps/pet_desktop/target/release/bundle/macos -path '*/Contents/MacOS/copilot-desktop-pet' -type f -print -quit)
          python3 scripts/pet-gui-verify.py --executable "$executable" --updater
      - name: Install signed macOS bundle update and cold-start updated executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp -R 'apps/pet_desktop/target/release/bundle/macos/Copilot Desktop Pet.app' "$RUNNER_TEMP/base-pet.app"
          python3 scripts/build-test-update.py
          python3 scripts/pet-gui-verify.py --executable "$RUNNER_TEMP/base-pet.app/Contents/MacOS/copilot-desktop-pet" --updater --update-package 'apps/pet_desktop/target/release/bundle/macos/Copilot Desktop Pet.app.tar.gz' --expected-executable 'apps/pet_desktop/target/release/bundle/macos/Copilot Desktop Pet.app/Contents/MacOS/copilot-desktop-pet'
          rm -rf 'apps/pet_desktop/target/release/bundle/macos/Copilot Desktop Pet.app'
          cp -R "$RUNNER_TEMP/base-pet.app" 'apps/pet_desktop/target/release/bundle/macos/Copilot Desktop Pet.app'
      - name: Install and execute Windows release package in disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/pet_desktop/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'pet-package'
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          $executable = Get-ChildItem $destination -Filter copilot-desktop-pet.exe -Recurse | Select-Object -First 1
          if (-not $executable) { throw 'Installed executable missing' }
          python3 scripts/pet-gui-verify.py --executable $executable.FullName --updater
          if ($LASTEXITCODE -ne 0) { throw 'Installed release GUI verification failed' }
      - name: Install signed Windows NSIS update and cold-start updated executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'pet-package') -Filter copilot-desktop-pet.exe -Recurse | Select-Object -First 1
          $baseInstaller = Get-ChildItem apps/pet_desktop/target/release/bundle/nsis -Filter '*_0.1.0_*.exe' | Select-Object -First 1
          if (-not $baseInstaller) { throw 'Base Windows installer missing' }
          $baseName = $baseInstaller.Name
          Copy-Item $baseInstaller.FullName (Join-Path $env:RUNNER_TEMP 'base-installer.exe')
          python3 scripts/build-test-update.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows update fixture build failed' }
          $update = Get-ChildItem apps/pet_desktop/target/release/bundle/nsis -Filter '*_0.1.1_*.exe' | Select-Object -First 1
          if (-not $update) { throw 'Windows update package missing' }
          python3 scripts/pet-gui-verify.py --executable $executable.FullName --updater --update-package $update.FullName --expected-executable apps/pet_desktop/target/test-update/copilot-desktop-pet.exe
          if ($LASTEXITCODE -ne 0) { throw 'Actual signed Windows update failed' }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'base-installer.exe') (Join-Path 'apps/pet_desktop/target/release/bundle/nsis' $baseName) -Force
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/pet_desktop/target/release/bundle/deb/*.deb
            apps/pet_desktop/target/release/bundle/appimage/*_0.1.0_*.AppImage
            apps/pet_desktop/target/release/bundle/macos/*.app/
            apps/pet_desktop/target/release/bundle/nsis/*_0.1.0_*.exe
            target/pet-gui-validation.json

      - name: Preserve isolated Windows updater diagnostics on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: updater-diagnostic-Windows
          path: |
            apps/pet_desktop/target/release/bundle/nsis/*.exe
            apps/pet_desktop/target/release/copilot-desktop-pet.exe
            target/pet-gui-validation.json
