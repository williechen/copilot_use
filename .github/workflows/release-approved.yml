name: Publish verified local P9 release
on:
  push:
    branches: [main]
    paths: [.github/release-approved.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: p9-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact approved source, CI and local evidence before immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release-approved.py
