# Isolated development integration environment; production requires TLS termination,
# dedicated secrets manager, metrics, backups and a hardened deployment.
services:
  chat-db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: bootstrap_owner
      POSTGRES_PASSWORD: ${CHAT_BOOTSTRAP_PASSWORD:?set CHAT_BOOTSTRAP_PASSWORD}
      PG_APP_USER: chat_user
      PG_APP_PASSWORD: ${CHAT_DB_PASSWORD:?set CHAT_DB_PASSWORD}
      PG_ENABLE_VECTOR: "true"
    volumes: [chat-data:/var/lib/postgresql/data, "./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap_owner -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 20
  analytics-db:
    image: postgres:17
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: bootstrap_owner
      POSTGRES_PASSWORD: ${ANALYTICS_BOOTSTRAP_PASSWORD:?set ANALYTICS_BOOTSTRAP_PASSWORD}
      PG_APP_USER: analytics_user
      PG_APP_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD}
    volumes: [analytics-data:/var/lib/postgresql/data, "./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap_owner -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 20
  analytics:
    build:
      context: .
      target: analytics
    environment:
      ANALYTICS_DATABASE_URL: postgres://analytics_user:${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD}@analytics-db:5432/analytics_db
      ANALYTICS_API_TOKEN: ${ANALYTICS_API_TOKEN:?set ANALYTICS_API_TOKEN}
      ANALYTICS_ADMIN_TOKEN: ${ANALYTICS_ADMIN_TOKEN:?set ANALYTICS_ADMIN_TOKEN}
      ANALYTICS_CHAT_TOKEN: ${ANALYTICS_CHAT_TOKEN:?set ANALYTICS_CHAT_TOKEN}
      ANALYTICS_PET_TOKEN: ${ANALYTICS_PET_TOKEN:?set ANALYTICS_PET_TOKEN}
      ANALYTICS_LISTEN: 0.0.0.0:3100
    depends_on:
      analytics-db: {condition: service_healthy}
    networks: [backend]
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped
  chat:
    build:
      context: .
      target: chat
    environment:
      CHAT_DATABASE_URL: postgres://chat_user:${CHAT_DB_PASSWORD:?set CHAT_DB_PASSWORD}@chat-db:5432/chat_db
      CHAT_API_TOKEN: ${CHAT_API_TOKEN:?set CHAT_API_TOKEN}
      ANALYTICS_CHAT_TOKEN: ${ANALYTICS_CHAT_TOKEN:?set ANALYTICS_CHAT_TOKEN}
      ANALYTICS_ENDPOINT: http://analytics:3100/api/v1/events
      ALLOW_INTERNAL_HTTP_DEV: "true"
      CHAT_LISTEN: 0.0.0.0:3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      chat-db: {condition: service_healthy}
      analytics: {condition: service_started}
    ports: ["127.0.0.1:3001:3001"]
    networks: [backend]
    restart: unless-stopped
networks:
  backend:
    internal: false
volumes:
  chat-data:
  analytics-data:
