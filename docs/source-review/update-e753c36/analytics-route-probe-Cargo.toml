[package]
name = "codex-analytics-route-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
analytics-server = { path = "../rust_ai_ring/analytics_apps/analytics_server" }
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.29.0", features = ["v4"] }
