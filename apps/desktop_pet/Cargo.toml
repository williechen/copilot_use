[package]
name = "copilot-desktop-pet"
version = "0.2.1"
edition = "2024"
build = "build.rs"
[workspace]
[dependencies]
day9-pet = { path = "../../crates/pet_runtime" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "=2.13.3"
updater-http= {package="reqwest",version="0.13",default-features=false}
base64="0.22"
minisign-verify="0.3"
semver="1"
url="2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.53", features = ["full"] }
copilot-telemetry = {path="../../crates/telemetry"}

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[build-dependencies]
tauri-build = "2.7"

[target.'cfg(target_os="linux")'.dependencies]
gtk="0.18"
glib="0.18.5"

[patch.crates-io]
glib = { path = "../../vendor/glib-0.18.5" }
