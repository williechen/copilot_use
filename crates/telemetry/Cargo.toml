[package]
name="copilot-telemetry"
version.workspace=true
edition.workspace=true
[dependencies]
opentelemetry = {version="0.33",features=["trace","metrics","logs"]}
opentelemetry_sdk = {version="0.33",features=["trace","metrics","logs"]}
opentelemetry-otlp = {version="0.33",default-features=false,features=["trace","metrics","logs","http-json","reqwest-blocking-client"]}
axum.workspace=true
tokio.workspace=true
url="2"
reqwest={version="0.13",default-features=false,features=["blocking","rustls"]}
opentelemetry-http={version="0.33",features=["reqwest-blocking"]}
async-trait.workspace=true
http="1"
bytes="1"

[dev-dependencies]
futures-executor="0.3"
